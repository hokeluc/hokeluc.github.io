<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Geist+Pixel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {% if page.url == "/" %}
  <script src="https://cdn.jsdelivr.net/npm/album-art@4.0.4/index.min.js"></script>
  {% endif %}
</head>
<body>

  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/blog/' | relative_url }}">Blog</a>
    <a href="{{ '/resume.pdf' | relative_url }}">Resume</a>
  </nav>

  <main>
    {{ content }}
  </main>

</body>
</html>
